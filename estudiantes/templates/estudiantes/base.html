<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ titulo }}{% endblock %} · Uniweb</title>
  <style>
    :root { --azul: #1e3a8a; --azul-osc: #172e6e; --rojo: #b91c1c; --gris: #6b7280; --borde: #e5e7eb; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; min-height: 100vh; }
    nav { background: var(--azul); color: #fff; }
    nav .contenido { max-width: 860px; margin: 0 auto; padding: .8rem 1rem; display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; }
    nav strong { margin-right: auto; font-size: 1.1rem; }
    nav a { color: #dbeafe; text-decoration: none; }
    nav a:hover, nav a[aria-current="page"] { color: #fff; text-decoration: underline; }
    main { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    .tarjeta { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 18px rgba(0, 0, 0, .08); }
    .tarjeta.angosta { max-width: 460px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 1.6rem; color: var(--azul); }
    a { color: var(--azul); }
    .boton { display: inline-block; background: var(--azul); color: #fff; border: 0; border-radius: 8px; padding: .6rem 1.05rem; font-size: 1rem; cursor: pointer; text-decoration: none; font-family: inherit; }
    .boton:hover { background: var(--azul-osc); }
    .boton.secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); }
    .boton.secundario:hover { background: #eff6ff; }
    .boton.peligro { background: var(--rojo); }
    .boton.peligro:hover { background: #991b1b; }
    .boton.chico { padding: .35rem .7rem; font-size: .9rem; }
    .mensaje { padding: .7rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .mensaje.success { background: #ecfdf5; border: 1px solid #10b981; color: #065f46; }
    .mensaje.error { background: #fef2f2; border: 1px solid var(--rojo); color: var(--rojo); }
    .campo { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .3rem; }
    input { width: 100%; padding: .6rem .7rem; font-size: 1rem; border: 1px solid #9ca3af; border-radius: 8px; font-family: inherit; }
    input:focus { outline: 2px solid #93c5fd; border-color: var(--azul); }
    input.invalido { border-color: var(--rojo); background: #fef2f2; }
    .error { display: block; min-height: 1.2em; margin-top: .25rem; font-size: .9rem; color: var(--rojo); }
    .acciones { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--gris); }
    hr { border: 0; border-top: 1px solid var(--borde); margin: 1.5rem 0; }
    {% block estilos %}{% endblock %}
  </style>
</head>
<body>
  <nav>
    <div class="contenido">
      <strong>Uniweb</strong>
      <a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>Inicio</a>
      <a href="{% url 'lista_estudiantes' %}" {% if request.resolver_match.url_name == 'lista_estudiantes' %}aria-current="page"{% endif %}>Estudiantes</a>
      <a href="{% url 'registro' %}" {% if request.resolver_match.url_name == 'registro' %}aria-current="page"{% endif %}>Registrar</a>
    </div>
  </nav>

  <main>
    {% for mensaje in messages %}
      <p class="mensaje {{ mensaje.tags }}" role="status">{{ mensaje }}</p>
    {% endfor %}

    {% block contenido %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
