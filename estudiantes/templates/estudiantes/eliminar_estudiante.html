{% extends "estudiantes/base.html" %}

{% block contenido %}
  <section class="tarjeta angosta">
    <h1>{{ titulo }}</h1>
    <p>¿Seguro que quieres eliminar a <strong>{{ estudiante.nombre }}</strong> ({{ estudiante.edad }} años)? Esta acción no se puede deshacer.</p>

    <form method="post">
      {% csrf_token %}
      <div class="acciones">
        <button class="boton peligro" type="submit">Sí, eliminar</button>
        <a class="boton secundario" href="{% url 'lista_estudiantes' %}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
